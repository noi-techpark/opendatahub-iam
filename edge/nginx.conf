# The edge in front of the demo APIs: the directives that ingress-nginx's
# auth-url and auth-response-headers annotations expand to. The hook is
# called once per request; its Authorization header replaces the client's.
events {}

http {
  upstream iam      { server iam:4010; }
  upstream demo_api { server demo-api:4011; }

  # Dev keys, matching docker-compose.yml. In production the key travels
  # the same way, from the proxy's private config.
  map $svc $service_key {
    timeseries dev-timeseries-service-key;
    content    dev-content-service-key;
    parking    dev-parking-service-key;
  }

  server {
    listen 4011;

    location = /healthz { proxy_pass http://demo_api; }

    location /timeseries/ { auth_request /_auth/timeseries; include hooked.conf; }
    location /content/    { auth_request /_auth/content;    include hooked.conf; }
    location /parking/    { auth_request /_auth/parking;    include hooked.conf; }

    location ~ ^/_auth/(?<svc>timeseries|content|parking)$ {
      internal;
      proxy_pass http://iam/v1/forward-auth/$svc;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Service-Key $service_key;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
    }

    # nginx answers a rejected credential itself, so the API's CORS headers
    # are absent; without these a browser reports a CORS failure, not a 401.
    error_page 401 = @unauthorized;
    location @unauthorized {
      default_type application/json;
      add_header Access-Control-Allow-Origin * always;
      return 401 '{"error":"invalid_token","message":"The credential was rejected by the identity service."}';
    }
  }
}
